    <!--
      you found the source. nice.

      the page is yours to change: settings.cfg lives in the status strip,
      the site map, and welcome.txt. it is kept in localStorage and never
      sent anywhere.

      there is also a notebook tucked under the left edge of the screen.
      it keeps your words in this browser and nowhere else — it is not
      part of the config, so it never travels with it. write a page and
      you can seal it: it hides until the day you choose, then opens by
      itself.

      and welcome.txt says how long you have been gone when you come
      back. the cat notices.

      and a trophy cabinet, on the shelf in the left rail. it watches
      what you do here and keeps its own list, also outside the config.

      the little _ □ ✕ on each window work now: reduce a section to its
      bar, restore it, or close it. closed ones wait in settings.cfg.

      and you can move a section: take it by its title bar and drag it
      up or down the column. the order is kept in the config too.

      the old ways still work:
        ↑ ↑ ↓ ↓ ← → ← → B A   →  VINE.EXE
        (or click the sun, or the leaf, three times)

      and if you can type the word:
        s y n t h             →  synth.exe
        (or press the ♪ in the footer)
    -->
