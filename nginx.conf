# ============================================================
# server block for the static build.
# the container speaks plain http on :80 and expects a reverse
# proxy in front to terminate TLS, so there is no certificate
# handling to do in here.
# ============================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # don't advertise the version
  server_tokens off;

  # ---- compression -----------------------------------------
  # the app gzips down small (fonts included); this is what does it
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # ---- headers ---------------------------------------------
  # nginx drops inherited add_header directives in any block that
  # sets its own, so every block below repeats the header set. The
  # CSP is long, so it lives in a variable set once here.
  #
  # the CSP is a whitelist the browser enforces: scripts only from
  # our own origin, images from us (plus the data-URI favicon and the
  # pokemon sprites), and network calls only to the click-to-load APIs
  # (cat facts, weather, pokéapi, trivia) plus the wss: relays the
  # sticky-notes handshake needs. frame-src is the deck's music: the
  # visitor pastes a youtube link and we frame youtube's own player,
  # but only after they press play. 'unsafe-inline' is needed for styles
  # because svelte writes inline style attributes; scripts stay locked
  # to 'self'.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://catfact.ninja https://api.open-meteo.com https://geocoding-api.open-meteo.com https://pokeapi.co https://opentdb.com wss:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; frame-ancestors 'self'";

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---- caching ---------------------------------------------
  # vite fingerprints everything under /assets/, so it can be cached
  # forever; the document itself must always revalidate
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # ---- routing ---------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
